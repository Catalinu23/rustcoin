[package]
name = "wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
lib = { path = "../lib" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
cursive = "0.21"
kanal = "0.1"
tokio = { version = "1", features = ["full"] }
